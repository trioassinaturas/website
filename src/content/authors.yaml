tomas-susin:
  order: 1
  name: Tomas Susin
  role: Co-fundador & CEO
  accent: coral
  bio: Founder da TAG Livros, um dos maiores clubes de assinatura do Brasil, e do Tinta Club del Libro, um clube com milhares de assinantes na Colômbia, Chile, Peru e México. São mais de 13 anos criando, escalando e operando clubes na prática, das primeiras caixinhas aos milhares de envios por mês. Na Trio, cuida para que a plataforma resolva os problemas reais de quem vive de recorrência.
  avatar: ../assets/founders/tomas.jpg
  url: https://www.linkedin.com/in/tom%C3%A1s-susin-dos-santos-22750650/

rafael-audibert:
  order: 2
  name: Rafael Audibert
  role: Co-fundador & CTO
  accent: blue
  bio: "Desenvolvedor de software com experiência não apenas na prática após trabalhar na TAG Livros mas também em produtos de alta escala usados por milhares de empresas no mundo todo. Na Trio, lidera a tecnologia: uma plataforma confiável, rápida e simples de usar, para que a recorrência do seu clube rode no piloto automático."
